name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reused by deploy.yml so a deploy reruns exactly these checks (FR-018).
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Before the build: it reports every card failure, Astro reports only the first (research R3).
      - run: npm run validate
      - run: npm run build
      # Budget and noindex over the built pages (plan.md § Performance budget).
      - run: npm run check:build
