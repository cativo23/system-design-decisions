name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reused by deploy.yml so a deploy reruns exactly these checks (FR-018).
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
