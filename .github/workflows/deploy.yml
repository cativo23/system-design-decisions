name: Deploy

# Manual only (FR-017). research.md R12: checks → publish → release → verify.
on:
  workflow_dispatch:

# Never cancel a deploy mid-way; a second dispatch waits for the first.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Rerun the full CI on the dispatched commit: nothing unchecked is published (FR-018).
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    # Only main reaches production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      short-sha: ${{ steps.sha.outputs.short }}
    steps:
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/systems-field-guide:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/systems-field-guide:${{ steps.sha.outputs.short }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    # Uses the SSH key, so it sits behind the same environment as publish.
    environment: prod
    steps:
      - uses: actions/checkout@v7
      # Third-party actions get the deploy key, so they're pinned to a full commit SHA.
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ vars.POLARIS_HOST }}
          port: ${{ vars.POLARIS_PORT }}
          username: ${{ secrets.POLARIS_USER }}
          key: ${{ secrets.POLARIS_SSH_KEY }}
          source: compose.prod.yml
          target: /home/cativo23/deploy/systems-field-guide
      # No docker login on the server: the image is public.
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.POLARIS_HOST }}
          port: ${{ vars.POLARIS_PORT }}
          username: ${{ secrets.POLARIS_USER }}
          key: ${{ secrets.POLARIS_SSH_KEY }}
          script: |
            set -e
            cd /home/cativo23/deploy/systems-field-guide
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --remove-orphans
            docker image prune -f

  # From the runner, over the public internet: DNS, TLS, Traefik and nginx (contracts/http-contract.md).
  verify:
    needs: [publish, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/health-gate.ts --origin https://architecture.cativo.dev --expect-version "$SHORT_SHA"
        env:
          SHORT_SHA: ${{ needs.publish.outputs.short-sha }}
