# research.md R10, contracts/http-contract.md.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik, an absolute redirect would leak http://…:8080; keep /cards/saga → /cards/saga/ relative.
    absolute_redirect off;

    # On every response, 404 and 5xx included ("always"). Keep add_header at this level only:
    # a location block that declares its own add_header silently drops this one.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
