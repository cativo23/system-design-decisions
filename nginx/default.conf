# research.md R10, R12; specs/002-design-system-card-layout/contracts/build-budget.md § nginx.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik, an absolute redirect would leak http://…:8080; keep /cards/saga → /cards/saga/ relative.
    absolute_redirect off;

    # The size budgets are measured on what this serves (gzip level 6), so keep the two in step.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # On every response, 404 and 5xx included ("always"). A location block that declares its own
    # add_header silently drops this one, so /_astro/ below repeats it.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Hashed build output (scripts, styles, fonts): the file name changes when the content does.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
